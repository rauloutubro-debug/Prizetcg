name: Check and build web
on:
  push:
    paths: ['App.tsx', 'src/**', 'tests/**', 'assets/**', 'package*.json', 'app.json', '.github/workflows/web-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
        env:
          CI: '1'
          EXPO_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: PTCGMAP-web
          path: dist
          retention-days: 7
